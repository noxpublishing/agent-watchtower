<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watchtower</title>
<link rel="stylesheet" href="avatars.css">
<style>
:root {
  color-scheme: light dark;
  --bg: #faf9f6; --strip: transparent; --ink: #1f1f1e; --soft: #6b6b68; --rule: #00000022; --track: #00000012;
  --flying: #1f78d6; --approach: #b56a00; --cleared: #0d8a63; --landed: #0d8a63; --blocked: #c93a3a; --holding: #66728a; --planned: #8e9cb3;
  
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a19; --strip: transparent; --ink: #ececeb; --soft: #a3a3a0; --rule: #ffffff1f; --track: #ffffff14;
    --flying: #6cb6ff; --approach: #ffb454; --cleared: #7fe7bb; --landed: #3ddc97; --blocked: #ff7b7b; --holding: #8e9cb3; --planned: #7c8aa2;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
main { max-width: 860px; margin: 0 auto; padding: 32px 20px 64px; }
header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
h1 { font: 800 30px/1.15 var(--sans); letter-spacing: -.01em; margin: 0; text-wrap: balance; min-width: 0; }
.base { margin-left: auto; font-size: 12.5px; color: var(--soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ci-ok { color: var(--landed); } .ci-red { color: var(--blocked); } .ci-run { color: var(--approach); }
.totals { display: grid; grid-template-columns: repeat(3, 1fr); margin: 18px 0 14px; }
.totals small { display: block; color: var(--soft); font-size: 12px; }
.totals b { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.fleet { display: flex; gap: 3px; margin: 0 0 8px; height: 6px; }
.slot { flex: 1 1 0; min-width: 2px; border-radius: 3px; background: var(--track); overflow: hidden; }
.slot i { display: block; height: 100%; background: currentColor; transition: width .4s ease; }
.tally { font-size: 12.5px; color: var(--soft); font-variant-numeric: tabular-nums; }
h2, summary { font: 800 21px/1.25 var(--sans); letter-spacing: -.005em; margin: 30px 0 12px; }
summary { cursor: pointer; }
.block { border: 1px solid var(--rule); border-radius: 10px; margin-bottom: 10px; color: var(--ink); }
.head { padding: 12px 14px 11px; }
.top { display: flex; align-items: baseline; gap: 10px; }
.top h3 { font: 750 17px/1.3 var(--sans); margin: 0; min-width: 0; overflow-wrap: anywhere; }
.state { margin-left: auto; font-size: 12.5px; color: var(--soft); white-space: nowrap; }
.state i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; }
.title { margin-top: 2px; overflow-wrap: anywhere; }
.route { display: flex; align-items: center; gap: 10px; margin: 9px 0 6px; font-size: 12.5px; color: var(--soft); font-variant-numeric: tabular-nums; }
.route div { flex: 1; height: 3px; border-radius: 2px; background: var(--track); overflow: hidden; }
.route u { display: block; height: 100%; background: currentColor; transition: width .4s ease; }
.note { font-size: 13px; color: var(--soft); overflow-wrap: anywhere; }
.ask { margin: 7px 0 4px; font-weight: 500; overflow-wrap: anywhere; }
.meta { margin-top: 4px; font-size: 12px; color: var(--soft); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.meta .warn { color: var(--approach); } .meta .bad { color: var(--blocked); }
.crew { display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--rule); padding: 8px 14px; }
.crew svg { flex: none; display: block; width: 36px; height: 36px; overflow: visible; }
.crew b { display: block; font-weight: 500; font-size: 13.5px; }
.crew span { font-size: 12px; color: var(--soft); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.quiet { display: flex; gap: 10px; align-items: center; padding: 3px 0; }
.quiet svg { flex: none; width: 30px; height: 30px; overflow: visible; }
.quiet em { margin-left: auto; font-style: normal; font-size: 12px; color: var(--soft); white-space: nowrap; }
.empty, .stale { color: var(--soft); margin-top: 28px; }
.stale { margin-top: 10px; font-size: 12.5px; color: var(--approach); }
.loose { font-size: 12.5px; line-height: 1.8; color: var(--soft); overflow-wrap: anywhere; }
.codex-pane { max-width: 680px; padding: 20px 16px 40px; }
.codex-pane h1 { font-size: 21px; font-weight: 650; }
.codex-pane h2, .codex-pane summary { font-size: 14px; font-weight: 650; margin: 22px 0 8px; }
.codex-pane .head { padding: 10px 12px; }
.codex-pane .crew { padding: 6px 12px; }
.codex-pane .top h3 { font-size: 14px; }
.codex-pane .title, .codex-pane .note { font-size: 12.5px; }
.codex-status { margin: 8px 0 14px; color: var(--soft); font-size: 12px; }
.codex-status[data-state="connected"] { color: var(--landed); }
.codex-status[data-state="offline"] { color: var(--blocked); }
.activity-list { list-style: none; margin: 0 0 18px; padding: 0; border-top: 1px solid var(--rule); }
.activity-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--rule); }
.activity-actor { display: flex; align-items: center; min-width: 0; gap: 8px; }
.activity-actor svg { display: block; flex: none; width: 30px; height: 30px; }
.activity-actor div { min-width: 0; }
.activity-list strong { display: block; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.activity-list small, .activity-state { color: var(--soft); font-size: 12px; overflow-wrap: anywhere; }
.activity-state { text-align: right; }
.activity-state.s-working { color: var(--flying); }
.activity-state.s-interrupted { color: var(--blocked); }
.activity-state.s-stale { color: var(--approach); }
summary:focus-visible { outline: 2px solid var(--flying); outline-offset: 3px; }
@media (max-width: 360px) { .codex-pane .base { margin-left: 0; } }
.s-flying { color: var(--flying); } .s-candidate, .s-review { color: var(--approach); } .s-cleared { color: var(--cleared); }
.s-landed { color: var(--landed); } .s-blocked { color: var(--blocked); } .s-parked { color: var(--holding); } .s-planned { color: var(--planned); }
@media (prefers-reduced-motion: reduce) { .slot i, .route u { transition: none; } }
</style>
</head>
<body>
<main id="board"></main>
<script src="avatars.js"></script>
<script>
const ORDER = ['blocked', 'candidate', 'review', 'cleared', 'flying', 'parked']
const LABEL = { flying: 'Running', candidate: 'Delivered', review: 'In review', cleared: 'Ready to land', landed: 'Landed', blocked: 'Needs you', parked: 'Paused', planned: 'Planned' }
const ACTIVITY = { working: 'Working', idle: 'Idle', interrupted: 'Interrupted', closed: 'Closed', stale: 'No recent signal' }
const board = document.getElementById('board')
const inCodex = board.hasAttribute('data-codex')
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const age = s => s >= 3600 ? `${Math.floor(s / 3600)}h${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}` : s >= 60 ? `${Math.floor(s / 60)}m` : `${s}s`
const tok = n => n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}k` : String(n)
const share = a => ['landed', 'cleared', 'candidate', 'review'].includes(a.state) ? 1 : a.total ? Math.min(1, a.done / a.total) : 0

function face(a) {
  const art = (window.__avatars || {})[a.class] || ''
  return `<svg class="av c-${esc(a.class)} is-${esc(a.state)} s-${esc(a.state)}" viewBox="0 0 48 48" aria-hidden="true">${art}</svg>`
}

function block(a) {
  const flags = []
  if (a.status === 'CONCERNS') flags.push('with concerns')
  if (a.round > 1) flags.push(`round ${a.round}`)
  if (a.missing) flags.push('<span class="bad">worktree folder is gone</span>')
  if (a.check) flags.push(`<span class="warn">check: ${esc(a.check)} ${age(a.checkAge)}</span>`)
  const meta = [esc(a.branch), `↑${a.ahead} ↓${a.behind}${a.dirty ? ` ✎${a.dirty}` : ''}`, ...flags].filter(Boolean).join(' · ')
  const pct = Math.round(share(a) * 100)
  const middle = a.state === 'blocked'
    ? `<div class="ask s-blocked">${esc(a.note || LABEL.blocked)}</div>`
    : `<div class="route s-${esc(a.state)}"><div><u style="width:${pct}%"></u></div>${a.total ? `<span>${a.done}/${a.total}</span>` : ''}</div>${a.note ? `<div class="note">${esc(a.note)}</div>` : ''}`
  const usage = [a.model.replace(/^claude-/, '').replace(/-(\d+)-(\d+)$/, ' $1.$2').replace(/^./, c => c.toUpperCase()), a.effort, a.ctxMax ? `ctx ${Math.round(a.ctx * 100 / a.ctxMax)}%` : '', a.tokens ? tok(a.tokens) : '', a.cost ? `≈$${a.cost.toFixed(2)}` : '', a.age ? age(a.age) : ''].filter(Boolean).join(' · ')
  return `<article class="block">
    <div class="head">
      <div class="top"><h3>${esc(a.worktree || a.id)}</h3><span class="state"><i class="s-${esc(a.state)}"></i>${esc(LABEL[a.state] || a.state)}</span></div>
      <div class="title">${esc(a.title)}</div>
      ${middle}
      <div class="meta">${meta}</div>
    </div>
    <div class="crew">${face(a)}<div><b>tower-${esc(a.class)}</b>${inCodex ? '' : `<span>${esc(usage || 'no usage reported yet')}</span>`}</div></div>
  </article>`
}

function quiet(a) {
  const right = a.state === 'planned' && a.after ? `after ${esc(a.after)}` : ''
  return `<div class="quiet">${face(a)}<span>${esc(a.title)}</span><em>${right}</em></div>`
}

function ciMark(ci) {
  if (ci.state === 'ok') return ' <span class="ci-ok">CI ok</span>'
  if (ci.state === 'red') return ' <span class="ci-red">CI red</span>'
  if (ci.state === 'running') return ' <span class="ci-run">CI …</span>'
  return ''
}

let openLanded = false

function activity(actors) {
  const active = actors.filter(a => a.state === 'working').length
  const rows = actors.slice(0, Math.max(active, 8)).map(a => {
    const meta = [a.worktree, a.model, a.actor.slice(-8)].filter(Boolean).map(esc).join(' · ')
    const name = a.kind === 'session' ? 'Codex session' : a.role && a.role !== 'default' ? a.role : 'Subagent'
    const role = a.role.replace(/^tower-/, '')
    const avatarClass = a.kind === 'session' ? 'ace' : Object.hasOwn(window.__avatars || {}, role) ? role : 'liner'
    const avatarState = a.state === 'working' ? 'flying' : a.state === 'interrupted' ? 'blocked' : 'parked'
    return `<li><div class="activity-actor">${face({ class: avatarClass, state: avatarState })}<div><strong>${esc(name)}</strong><small>${meta}</small></div></div>
      <span class="activity-state s-${esc(a.state)}">${esc(ACTIVITY[a.state] || a.state)}</span></li>`
  }).join('')
  return `<h2>Codex activity${active ? ` · ${active} working` : ''}</h2>${
    rows ? `<ul class="activity-list">${rows}</ul>` : '<p class="tally">Waiting for Codex events. Start a turn in this repository with the Watchtower hooks enabled.</p>'
  }`
}

function render(f) {
  const areas = f.areas.filter(a => a.state !== 'dropped')
  const landed = areas.filter(a => a.state === 'landed')
  const planned = areas.filter(a => a.state === 'planned')
  const open = ORDER.flatMap(state => areas.filter(a => a.state === state))
  const running = areas.filter(a => a.state === 'flying').length
  const cost = areas.reduce((sum, a) => sum + a.cost, 0)
  const tokens = areas.reduce((sum, a) => sum + a.tokens, 0)
  const seconds = Math.max(0, ...areas.map(a => a.age))
  const fleet = areas.map(a => `<div class="slot s-${esc(a.state)}" title="${esc(a.id)}: ${esc(LABEL[a.state] || a.state)}"><i style="width:${a.state === 'blocked' ? 100 : Math.round(share(a) * 100)}%"></i></div>`).join('')
  let html = `<header><h1>${esc(f.mission || 'Watchtower')}</h1><span class="base">${esc(f.base)} @ ${esc(f.sha)}${ciMark(f.ci)}</span></header>`
  if (inCodex) html += `<p class="codex-status" id="connection" role="status" data-state="connected">Live · Local Codex</p>${activity(f.codex || [])}`
  else html += `<div class="totals"><div><small>Cost</small><b>≈$${cost.toFixed(2)}</b></div><div><small>Tokens</small><b>${tok(tokens)}</b></div><div><small>Time</small><b>${age(seconds)}</b></div></div>`
  html += `
    <div class="fleet" role="img" aria-label="${landed.length} of ${areas.length} areas landed">${fleet}</div>
    <div class="tally">${landed.length}/${areas.length} landed · ${running} running · limit ${f.limit ?? 'none'} · checks ${f.runways.busy}/${f.runways.limit}${f.runways.waiting ? ` +${f.runways.waiting}` : ''}</div>
    <p class="stale" id="stale" hidden>This page stopped updating. Is tower-board.sh --html --watch still running?</p>`
  if (!areas.length) html += '<p class="empty">No flight plan yet. <code>tower-area.sh add</code> starts it.</p>'
  if (open.length) html += `<h2>Worktrees · ${running} running of ${open.length}</h2>${open.map(block).join('')}`
  if (planned.length) html += `<h2>Planned · ${planned.length}</h2>${planned.map(quiet).join('')}`
  if (landed.length) html += `<details ${openLanded ? 'open' : ''} id="landed"><summary>Landed · ${landed.length}</summary>${landed.map(quiet).join('')}</details>`
  if (f.loose.length) html += `<h2>Other worktrees · ${f.loose.length}</h2><div class="loose">${f.loose.map(w => `${esc(w.worktree)} · ${esc(w.branch)} ↑${w.ahead} ↓${w.behind} ✎${w.dirty}`).join('<br>')}</div>`
  const restoreFocus = document.activeElement?.matches('#landed > summary')
  board.innerHTML = html
  const details = document.getElementById('landed')
  if (details) {
    details.addEventListener('toggle', () => { openLanded = details.open })
    if (restoreFocus) details.firstElementChild.focus({ preventScroll: true })
  }
  document.title = `${landed.length}/${areas.length} landed · Watchtower`
}

let last = ''
function update(fleet) {
  const next = JSON.stringify(fleet, (key, value) => inCodex && (key === 'now' || key === 'age') ? undefined : value)
  if (next !== last) { last = next; render(fleet) }
}

function pollFile() {
  // A script tag is the one way to refresh from a file:// page without a server.
  const tag = document.createElement('script')
  tag.src = `data.js?t=${Date.now()}`
  tag.onload = () => {
    tag.remove()
    update(window.__fleet)
    const stale = document.getElementById('stale')
    if (stale) stale.hidden = Date.now() / 1000 - window.__fleet.now < 20
  }
  tag.onerror = () => tag.remove()
  document.head.append(tag)
}

async function pollCodex() {
  let connected = false
  try {
    const response = await fetch('fleet.json', { signal: AbortSignal.timeout(12000) })
    if (response.ok) {
      update(await response.json())
      connected = true
    }
  } catch {
    // Keep the last fleet visible while the local server is unavailable.
  }
  const status = document.getElementById('connection')
  const next = connected ? 'connected' : 'offline'
  if (status && status.dataset.state !== next) {
    status.dataset.state = next
    status.textContent = connected ? 'Live · Local Codex' : 'Disconnected · Showing the last available state'
  }
  setTimeout(pollCodex, 2000)
}

if (inCodex) {
  board.classList.add('codex-pane')
  board.innerHTML = '<h1>Watchtower</h1><p class="codex-status" id="connection" role="status">Connecting to the local board…</p>'
  pollCodex()
} else {
  pollFile()
  setInterval(pollFile, 2000)
}
</script>
</body>
</html>
