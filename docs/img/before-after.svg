<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="Left: twenty agents crowd three test slots and go stale at every landing. Right: three agents fly, the others park, and each lands in turn.">
  <defs><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .h{font-size:34px;font-weight:700}.s{font-size:20px;fill:#B6C3D6}.t{font-size:17px}.n{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px}
  </style></defs>
  <rect width="1280" height="560" rx="18" fill="#0E1525"/>
  <line x1="640" y1="40" x2="640" y2="520" stroke="#27324A" stroke-width="2"/>

  <!-- left -->
  <text x="52" y="72" class="h" fill="#FF8A80">Everyone at once</text>
  <text x="52" y="106" class="s">More sessions, slower landings.</text>
  <g fill="#3A2730" stroke="#FF8A80" stroke-opacity=".55">
    <rect x="52" y="140" width="46" height="26" rx="5"/><rect x="106" y="140" width="46" height="26" rx="5"/><rect x="160" y="140" width="46" height="26" rx="5"/><rect x="214" y="140" width="46" height="26" rx="5"/><rect x="268" y="140" width="46" height="26" rx="5"/><rect x="322" y="140" width="46" height="26" rx="5"/><rect x="376" y="140" width="46" height="26" rx="5"/><rect x="430" y="140" width="46" height="26" rx="5"/>
    <rect x="52" y="174" width="46" height="26" rx="5"/><rect x="106" y="174" width="46" height="26" rx="5"/><rect x="160" y="174" width="46" height="26" rx="5"/><rect x="214" y="174" width="46" height="26" rx="5"/><rect x="268" y="174" width="46" height="26" rx="5"/><rect x="322" y="174" width="46" height="26" rx="5"/><rect x="376" y="174" width="46" height="26" rx="5"/><rect x="430" y="174" width="46" height="26" rx="5"/>
  </g>
  <text x="490" y="176" class="n" fill="#FFB3AC">16 waiting</text>
  <g fill="none" stroke="#FF8A80" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 5">
    <path d="M120,204 L200,258"/><path d="M264,204 L264,258"/><path d="M400,204 L328,258"/>
  </g>
  <g fill="#FFB454">
    <rect x="164" y="262" width="88" height="34" rx="6"/><rect x="264" y="262" width="88" height="34" rx="6"/><rect x="364" y="262" width="88" height="34" rx="6"/>
  </g>
  <g class="n" font-size="15" fill="#20170A" text-anchor="middle">
    <text x="208" y="284">slot</text><text x="308" y="284">slot</text><text x="408" y="284">hung?</text>
  </g>
  <line x1="52" y1="356" x2="590" y2="356" stroke="#FF8A80" stroke-width="4" stroke-linecap="round" stroke-dasharray="44 16"/>
  <text x="52" y="340" class="n" fill="#FF8A80">main: red again</text>
  <g class="t" fill="#D5DCE8">
    <text x="52" y="402">Every landing makes all the others stale, so they rebase and test again</text>
    <text x="52" y="432">One hung test can hold a slot for hours without anyone noticing</text>
    <text x="52" y="462">Two agents make the same edit: git merges it, and the total is wrong</text>
    <text x="52" y="492">The limit runs out while finished work still sits on branches</text>
  </g>

  <!-- right -->
  <text x="692" y="72" class="h" fill="#3DDC97">Three at a time</text>
  <text x="692" y="106" class="s">Few fly, one lands, the rest cost nothing.</text>
  <g fill="#1B2436" stroke="#54627A">
    <rect x="692" y="140" width="46" height="26" rx="5"/><rect x="746" y="140" width="46" height="26" rx="5"/><rect x="800" y="140" width="46" height="26" rx="5"/><rect x="854" y="140" width="46" height="26" rx="5"/><rect x="908" y="140" width="46" height="26" rx="5"/><rect x="962" y="140" width="46" height="26" rx="5"/>
  </g>
  <text x="1022" y="158" class="n" fill="#8E9CB3">parked, work committed</text>
  <g fill="none" stroke="#FFB454" stroke-width="2.5">
    <path d="M782,170 L782,214"/><path d="M880,170 L880,214"/><path d="M978,170 L978,214"/>
  </g>
  <g fill="#FFB454">
    <rect x="738" y="216" width="88" height="34" rx="6"/><rect x="836" y="216" width="88" height="34" rx="6"/><rect x="934" y="216" width="88" height="34" rx="6"/>
  </g>
  <g class="n" fill="#20170A" text-anchor="middle"><text x="782" y="238">flying</text><text x="880" y="238">flying</text><text x="978" y="238">flying</text></g>
  <text x="1036" y="238" class="n" fill="#FFC56B">time limit on checks</text>
  <path d="M880,252 L880,290" stroke="#3DDC97" stroke-width="3"/>
  <rect x="806" y="292" width="148" height="34" rx="6" fill="#123326" stroke="#3DDC97"/>
  <text x="880" y="314" class="n" fill="#7FE7BB" text-anchor="middle">tower lands one</text>
  <path d="M880,328 L880,352" stroke="#3DDC97" stroke-width="3"/>
  <line x1="692" y1="356" x2="1230" y2="356" stroke="#3DDC97" stroke-width="4" stroke-linecap="round"/>
  <circle cx="880" cy="356" r="8" fill="#0E1525" stroke="#3DDC97" stroke-width="4"/>
  <text x="692" y="340" class="n" fill="#3DDC97">main: green</text>
  <g class="t" fill="#D5DCE8">
    <text x="692" y="402">Several ready? One integration branch, one full test run</text>
    <text x="692" y="432">Hung checks stop themselves and say so</text>
    <text x="692" y="462">Parked sessions wait instead of wasting a test run</text>
    <text x="692" y="492">Near the limit, landing goes before building</text>
  </g>
</svg>
